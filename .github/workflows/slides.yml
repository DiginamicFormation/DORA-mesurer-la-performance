name: Slides

# Produit cinq fichiers à partir des sources du dépôt :
#   - dora-slides.pdf            les diapositives (Marp)
#   - dora-slides.pptx           les mêmes, en PowerPoint (Marp)
#   - dora-slides-white.pdf      les diapositives sans le style sombre (Marp)
#   - dora-slides-white.pptx     les mêmes, en PowerPoint (Marp)
#   - dora-support-de-cours.pdf  le Readme.md mis en page (md-to-pdf)
#
# Le workflow se déclenche uniquement sur un tag `v*` : les documents sont
# produits pour une version identifiée, jamais à chaque commit. Ils sont
# publiés comme artefact du run (90 jours) ET attachés à une release GitHub,
# en téléchargement direct et permanent.
#
#   git tag v1.0 && git push origin v1.0
#
# `workflow_dispatch` reste ouvert pour un essai à blanc : il produit
# l'artefact sans créer de release, ce qui permet de valider le rendu sans
# consommer un numéro de version.
#
# Les actions sont épinglées sur une majeure. Pour un usage réellement en
# production, épinglez-les sur un SHA de commit plutôt que sur un tag mouvant,
# comme le recommande le chapitre 5.3 du support.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Versions exactes : le rendu doit être reproductible d'un run à l'autre.
  # À bumper volontairement, pas à laisser flotter sur @latest.
  MARP_VERSION: 4.5.1
  MD_TO_PDF_VERSION: 5.2.5
  MERMAID_CLI_VERSION: 11.17.0

  # Logo inliné dans l'en-tête du support de cours. Récupéré au build plutôt
  # que versionné : une seule source de vérité, le dépôt PublicAssets.
  LOGO_URL: https://raw.githubusercontent.com/DiginamicInternal/PublicAssets/refs/heads/main/Logo-diginamic-color.svg

  # Le délai par défaut de Marp est de 30 s, insuffisant ici : les slides
  # chargent le logo et l'illustration depuis des URL distantes, et le rendu
  # dépasse ce délai. Vérifié : à 30 s la conversion échoue sur
  # « Timed out after waiting 30000ms ».
  PUPPETEER_TIMEOUT: "180000"

jobs:
  build:
    name: Générer les documents
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Marp détecte Chrome tout seul, mais md-to-pdf et mermaid-cli attendent
      # un Chrome installé par Puppeteer, absent du runner. On leur passe donc
      # explicitement le binaire préinstallé, sans le télécharger.
      - name: Localiser Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::Aucun navigateur Chromium trouvé sur le runner."
            exit 1
          fi
          echo "Chrome trouvé : $CHROME ($("$CHROME" --version))"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"

      - name: Préparer les dossiers
        run: mkdir -p dist build

      # ---------------------------------------------------------------- slides

      - name: Générer les diapositives en PDF
        run: |
          npx --yes "@marp-team/marp-cli@${MARP_VERSION}" slides.md \
            --pdf \
            --pdf-outlines \
            --output dist/dora-slides.pdf

      - name: Générer les diapositives en PPTX
        run: |
          npx --yes "@marp-team/marp-cli@${MARP_VERSION}" slides.md \
            --pptx \
            --output dist/dora-slides.pptx

      # Deux transformations : on retire le bloc `style:` (fond sombre), puis on
      # échange le logo du footer. Le PNG « -blk » est fait pour le fond sombre ;
      # sur fond blanc, c'est le SVG couleur qu'il faut.
      - name: Préparer la version white
        run: |
          awk '
            $0 == "style: |" { skip=1; next }
            skip && $0 ~ /^  / { next }
            skip { skip=0 }
            { print }
          ' slides.md \
          | sed 's|Logo-diginamic-color-blk\.png|Logo-diginamic-color.svg|g' \
          > build/slides-white.md
          grep -n Logo-diginamic build/slides-white.md

      - name: Générer les diapositives white en PDF
        run: |
          npx --yes "@marp-team/marp-cli@${MARP_VERSION}" build/slides-white.md \
            --pdf \
            --pdf-outlines \
            --output dist/dora-slides-white.pdf

      - name: Générer les diapositives white en PPTX
        run: |
          npx --yes "@marp-team/marp-cli@${MARP_VERSION}" build/slides-white.md \
            --pptx \
            --output dist/dora-slides-white.pptx

      # --------------------------------------------------------------- support

      # Le Readme contient un diagramme mermaid. md-to-pdf le rendrait en bloc
      # de code brut : mermaid-cli le remplace d'abord par un SVG, dans une
      # COPIE du fichier. Readme.md n'est jamais modifié, pour que GitHub
      # continue d'afficher le diagramme nativement.
      - name: Rendre les diagrammes mermaid
        run: |
          export PUPPETEER_EXECUTABLE_PATH="$CHROME_BIN"
          cp Readme.md build/
          cd build
          npx --yes "@mermaid-js/mermaid-cli@${MERMAID_CLI_VERSION}" \
            --input Readme.md \
            --output dora-support-de-cours.md

      # Le PDF circule seul, détaché du dépôt : sans cette mention, le lecteur
      # n'a aucun moyen de remonter à la source ni de vérifier s'il tient une
      # version à jour. On l'ajoute à la COPIE de travail, jamais au Readme.
      - name: Ajouter l'URL du dépôt source en fin de document
        working-directory: build
        run: |
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          cat >> dora-support-de-cours.md <<SOURCE

          ## Source

          Ce document est généré à partir du \`Readme.md\` du dépôt :

          [${REPO_URL}](${REPO_URL})

          Version : \`${GITHUB_REF_NAME}\`
          SOURCE
          tail -12 dora-support-de-cours.md

      # L'en-tête porte le logo. Chrome rend les templates d'en-tête et de pied
      # dans un contexte isolé, sans accès réseau : une URL distante y resterait
      # vide. Le SVG est donc récupéré ici et inliné en data URI. La marge haute
      # passe de 18 à 24 mm pour lui laisser la place.
      - name: Générer le support de cours en PDF
        working-directory: build
        run: |
          LOGO_B64="$(curl -fsSL "$LOGO_URL" | base64 -w0)"
          if [ -z "$LOGO_B64" ]; then
            echo "::error::Logo vide ou introuvable : $LOGO_URL"
            exit 1
          fi

          cat > pdf-options.json <<PDFOPTS
          {
            "format": "A4",
            "margin": {"top": "24mm", "bottom": "20mm", "left": "16mm", "right": "16mm"},
            "printBackground": true,
            "displayHeaderFooter": true,
            "headerTemplate": "<div style=\"width:100%;padding:8mm 16mm 0;text-align:right\"><img src=\"data:image/svg+xml;base64,${LOGO_B64}\" style=\"height:8mm\"></div>",
            "footerTemplate": "<div style=\"width:100%;font-size:8px;color:#888;padding:0 16mm;display:flex;justify-content:space-between\"><span>DORA - Mesurer la performance de livraison logicielle</span><span class=\"pageNumber\"></span></div>"
          }
          PDFOPTS

          npx --yes "md-to-pdf@${MD_TO_PDF_VERSION}" dora-support-de-cours.md \
            --document-title "DORA - Mesurer la performance de livraison logicielle" \
            --launch-options "{\"executablePath\":\"${CHROME_BIN}\"}" \
            --pdf-options "$(cat pdf-options.json)"
          mv dora-support-de-cours.pdf ../dist/

      # ---------------------------------------------------------------- garde-fou

      # Marp comme md-to-pdf sortent parfois en code 0 sans avoir écrit de
      # fichier exploitable : on vérifie que les cinq existent et sont pleins.
      - name: Vérifier les fichiers produits
        run: |
          fail=0
          for f in dist/dora-slides.pdf dist/dora-slides.pptx dist/dora-slides-white.pdf dist/dora-slides-white.pptx dist/dora-support-de-cours.pdf; do
            if [ ! -s "$f" ]; then
              echo "::error::$f absent ou vide"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          ls -lh dist
          {
            echo "### Documents générés"
            echo ""
            echo "| Fichier | Taille |"
            echo "|---|---|"
            for f in dist/*; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier l'artefact
        uses: actions/upload-artifact@v7
        with:
          name: dora-documents
          path: dist/
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publier la release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    # Seul ce job a besoin d'écrire : le job de build reste en lecture seule.
    permissions:
      contents: write

    steps:
      # Pas de checkout : gh n'a pas besoin du dépôt en local, GH_REPO suffit.
      - name: Récupérer les documents générés
        uses: actions/download-artifact@v8
        with:
          name: dora-documents
          path: dist

      - name: Créer la release et y attacher les documents
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -lh dist
          gh release create "${GITHUB_REF_NAME}" \
            dist/dora-slides.pdf \
            dist/dora-slides.pptx \
            dist/dora-slides-white.pdf \
            dist/dora-slides-white.pptx \
            dist/dora-support-de-cours.pdf \
            --title "DORA ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
